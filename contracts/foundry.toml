[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Pinned, both of them, and neither is cosmetic.
#
# Unpinned, Foundry chose the newest fork it knew about — `prague` on 1.7.1 —
# which is a fork X Layer may not implement, and which changes the emitted
# bytecode the moment the toolchain updates under a contract already deployed.
# A verifier that compiles at a different target then cannot reproduce what is
# on-chain, which is exactly how NoteFactory became unverifiable while the
# registry beside it verified.
evm_version = "cancun"
# No metadata hash appended. It encodes source paths and an IPFS digest, so the
# same code compiled from a different directory layout produces different
# bytecode — and verification turns on an exact match.
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]


[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fuzz]
runs = 256

# X Layer. Chain 1952 for testnet, verified against the RPC (eth_chainId
# returns 0x7a0); 196 for mainnet. The commonly cited 195 is wrong.
[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC_URL}"
xlayer = "${XLAYER_RPC_URL}"

# OKLink is not Etherscan-compatible, so verification goes through its own
# plugin endpoint rather than an [etherscan] entry. The trailing path segment is
# OKLink's chainShortName: XLAYER_TESTNET for 1952, XLAYER for 196.
#
#   forge verify-contract <address> src/NoteFactory.sol:NoteFactory \
#     --verifier oklink \
#     --verifier-url https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET \
#     --watch
#
# X Layer's own guide passes no API key for the oklink verifier — the key it
# mentions is for Etherscan verification only. If a request is rejected as
# unauthorised, add `--etherscan-api-key $OKLINK_API_KEY`.
#
# OKLink needs about a minute after deployment before it will accept a
# verification request for a new address, so pair this with --watch.
